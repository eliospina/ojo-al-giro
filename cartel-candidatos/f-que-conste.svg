  <text x="932" y="330" text-anchor="middle" font-family="Bodoni 72" font-weight="bold" font-size="118" fill="#b42318">1.300</text>
  <text x="932" y="384" text-anchor="middle" font-family="Baskerville" font-size="42" fill="#37312a">millones USD</text>
  <rect x="852" y="410" width="160" height="1" fill="#c9c2b2"/>
  <text x="932" y="452" text-anchor="middle" font-family="Baskerville" font-style="italic" font-size="27" fill="#37312a">&#183; ofertas, no un giro</text>

  <rect x="480" y="534" width="240" height="1" fill="#c9c2b2"/>
  <text x="600" y="566" text-anchor="middle" font-family="American Typewriter" font-size="20" letter-spacing="2" fill="#37312a">Colombia &#183; sismo 10 ago 2026</text>
