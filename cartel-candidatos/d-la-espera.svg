  <rect x="620" y="258" width="110" height="1.5" fill="#3a2718"/>
  <rect x="595" y="253" width="11" height="11" transform="rotate(45 600.5 258.5)" fill="#b44a28"/>

  <text x="600" y="330" text-anchor="middle" font-family="Big Caslon" font-style="italic" font-size="40" fill="#3a2718">Hay gente esperando hospital, agua, comida y techo.</text>

  <text x="600" y="476" text-anchor="middle" font-family="Bodoni 72" font-weight="bold" font-size="100" fill="#b44a28">1.300 millones USD</text>
  <text x="600" y="530" text-anchor="middle" font-family="American Typewriter" font-size="24" letter-spacing="3" fill="#3a2718">&#183; ofertas, no un giro</text>

